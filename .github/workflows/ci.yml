# Wi-Live CI: format, lint and test on every platform, then build the app.
# Not yet run: the repository has not been pushed (docs/PROGRESS.md).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: Page crypto (RFC vectors and the Rust bytes)
        run: node tests/unit/crypto_check.js
      - name: Build the app
        run: cargo build --release -p wilive
      - uses: actions/upload-artifact@v4
        with:
          name: wilive-${{ matrix.os }}
          path: |
            target/release/wilive
            target/release/wilive.exe
          if-no-files-found: ignore
