[package]
name = "wilive-server"
description = "Wi-Live: one port for the dashboard, the pairing API and the signaling WebSocket."
version.workspace = true
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true

[dependencies]
wilive-core = { path = "../wilive-core" }
wilive-stream = { path = "../wilive-stream" }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
log = "0.4.34"
hex = "0.4.3"
qrcode = { version = "0.15.0", default-features = false }
memory-stats = "1.2.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
png = "0.18.1"
